<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#141312">
<title>秋の夜長 対話のしおり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: キービジュアルと同じ「夜の黒板」。白いチョーク文字と灯明の金。上にKV、下に4タブ。単一の夜テーマ */
:root{
  --sumi:#141312;        /* 背景：墨 */
  --panel:#211f1d;       /* カード面 */
  --panel-2:#2c2926;     /* カード内の面 */
  --chalk:#f7f4ec;       /* 本文：チョークの白 */
  --chalk-2:#dcd6ca;     /* 補助文字（コントラスト高め） */
  --tomyo:#f2c46a;       /* 灯明の金 */
  --momiji:#f08a62;      /* 紅葉 */
  --line:rgba(247,244,236,.18);
  --f-hand:"Yusei Magic","Klee One","Hiragino Maru Gothic ProN",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{background:var(--sumi);color:var(--chalk)}
body{font-family:var(--f-body);font-weight:500;font-size:16px;line-height:1.8;padding-inline:16px;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:900;line-height:1.4}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:left}
button:focus-visible,a:focus-visible{outline:3px solid var(--tomyo);outline-offset:3px;border-radius:10px}
a{color:var(--tomyo)}

/* KV */
.hero{position:relative;margin-top:14px;padding:18px 20px 20px;border-radius:24px;background:radial-gradient(120% 90% at 85% 10%,#2b2a3a 0%,var(--panel) 55%,var(--sumi) 100%);border:1px solid var(--line);overflow:hidden;display:grid;gap:16px}
.hero-art{display:block;width:100%;height:auto;margin:-6px 0 -6px}
.hero-text{position:relative;display:grid;gap:6px}
.kicker{font-family:var(--f-hand);font-size:clamp(16px,4.6vw,20px);color:var(--tomyo);line-height:1.5}
.hero h1{font-family:var(--f-hand);font-weight:400;display:grid;line-height:1.2}
.hero h1 .s{font-size:clamp(24px,7vw,32px)}
.hero h1 .big{font-size:clamp(40px,12vw,58px);margin-left:-.35em;white-space:nowrap;text-shadow:0 3px 0 rgba(240,138,98,.45)}
.friends{position:relative;display:flex;padding-left:8px;margin-top:4px;overflow:hidden}
.friends .av{width:48px;height:48px;margin-left:-8px;border:3px solid var(--panel);border-radius:14px;transform:rotate(var(--r,0deg))}
.hero .place{position:relative;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:14.5px;color:var(--chalk-2);border-top:1px dashed var(--line);padding-top:12px}
.hero .place b{color:var(--tomyo);font-weight:700}
.av{display:inline-block;flex:none;border-radius:24%;overflow:hidden;background:#fffbf0;line-height:0}
.av img,.av svg{display:block;width:100%;height:100%;object-fit:cover}

/* section */
section[data-view]{padding-block:14px 28px;display:grid;gap:20px}
.sec-head{display:grid;gap:8px}
.tag{justify-self:start;font-size:13px;font-weight:700;letter-spacing:.12em;padding:3px 14px;background:var(--tomyo);color:var(--sumi);border-radius:99px}
.sec-head h2{font-family:var(--f-hand);font-weight:600;font-size:27px;line-height:1.45}
.sec-head p{color:var(--chalk-2);font-size:15px}
.tap{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--tomyo);font-weight:700}

/* ground rules */
.rules{background:var(--panel);border:2px solid var(--tomyo);border-radius:20px;padding:20px 18px;display:grid;gap:16px}
.rules h3{font-size:18px;color:var(--tomyo)}
.rule-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rule{background:var(--panel-2);border-radius:14px;padding:14px 4px 12px;text-align:center;display:grid;gap:6px;justify-items:center}
.rule svg{width:34px;height:34px}
.rule b{font-size:15px;line-height:1.35}
.flow{display:grid;gap:8px;font-size:15.5px}
.flow ol{margin:0;padding-left:1.4em;display:grid;gap:6px}
.clap{background:var(--momiji);color:var(--sumi);font-weight:900;border-radius:12px;padding:10px 14px;text-align:center;font-size:16px}
.lbl{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--tomyo);margin-bottom:8px}

/* teams */
.teams{display:grid;gap:14px}
.team{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.team.open{border-color:var(--c)}
.team-btn{display:grid;grid-template-columns:56px 1fr 28px;gap:14px;align-items:start;padding:18px 16px;width:100%}
.mark{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;font-weight:900;color:var(--sumi);background:var(--c)}
.team-btn .t{min-width:0;display:grid;gap:4px}
.team-btn .name{font-size:19px;font-weight:900;line-height:1.45}
.team-btn .common{font-size:14.5px;color:var(--chalk-2);line-height:1.6}
.faces{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:8px}
.face{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:700}
.face .av{width:32px;height:32px;border-radius:9px}
.chev{align-self:center;width:28px;height:28px;border-radius:50%;background:var(--panel-2);display:grid;place-items:center;color:var(--tomyo);font-weight:900;transition:transform .25s}
.team.open .chev{transform:rotate(90deg)}
.team-body{padding:0 16px 20px;display:grid;gap:20px}
.common-box{background:var(--panel-2);border-radius:14px;padding:12px 16px;font-size:16px;font-weight:700}
.qs{display:grid;gap:12px}
.q{background:var(--chalk);color:var(--sumi);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.q .n{width:34px;height:34px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-weight:900;font-size:14px}
.q .txt{font-size:17px;font-weight:700;line-height:1.65}
.q small{display:block;font-size:12.5px;font-weight:700;color:#7a5a1e;margin-top:4px}
.mlist{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;width:100%;background:var(--panel-2);border-radius:14px;padding:8px 12px}
.mrow .av{width:52px;height:52px}
.mrow .who{min-width:0;display:grid}
.mrow .who b{font-size:16px}
.mrow .who span{font-size:14.5px;color:var(--chalk-2);line-height:1.55}
.hint{font-size:14.5px;color:var(--chalk-2);background:rgba(240,138,98,.12);border-radius:12px;padding:10px 14px}
.hint b{color:var(--momiji)}

/* people */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px}
.person{display:grid;justify-items:center;gap:4px;padding:12px 6px 14px;border-radius:18px;background:var(--panel);border:1px solid var(--line);text-align:center;transition:transform .15s}
.person:active{transform:scale(.96)}
.person .av{width:82px;height:82px}
.person .nm{font-size:16px;font-weight:900;line-height:1.3;word-break:break-all}
.person .an{font-size:12.5px;color:var(--chalk-2);line-height:1.3}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:20;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88%;overflow:auto;background:var(--panel);border-radius:24px 24px 0 0;border-top:2px solid var(--tomyo);padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.sheet .grab{width:48px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet .inner{max-width:520px;margin:0 auto;display:grid;gap:18px}
.prof-head{display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:center}
.prof-head .av{width:104px;height:104px}
.prof-head h3{font-size:26px}
.prof-head .anm{font-size:14px;color:var(--tomyo);font-weight:700}
.prof-head .role{font-size:14px;color:var(--chalk-2)}
.moya{background:var(--chalk);color:var(--sumi);border-radius:16px;padding:16px;font-size:18px;font-weight:900;line-height:1.6}
.kv{display:grid;grid-template-columns:auto 1fr;gap:12px 14px;font-size:15.5px;align-items:baseline;margin:0}
.kv dt{font-size:13.5px;color:var(--chalk-2);white-space:nowrap}
.kv dd{margin:0;font-weight:700}
.pill{display:inline-block;padding:2px 12px;border-radius:99px;font-size:15px;background:var(--panel-2);border:1px solid var(--line)}
.pill.main{background:var(--tomyo);color:var(--sumi);border-color:var(--tomyo)}
.anote{font-size:14px;color:var(--chalk-2);background:var(--panel-2);border-radius:12px;padding:12px 14px}
.close{justify-self:stretch;text-align:center;padding:14px;border-radius:14px;background:var(--panel-2);font-weight:700;font-size:16px}

/* about */
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px 18px;display:grid;gap:14px}
.card h3{font-size:21px}
.card p{font-size:15.5px}
.temple-photo{margin:-20px -18px 2px;display:grid;gap:8px}
.temple-photo img{display:block;width:100%;height:auto;border-radius:20px 20px 0 0}
.temple-photo figcaption{font-size:13.5px;color:var(--chalk-2);padding:0 18px}
.timeline{display:grid;font-size:15px}
.timeline div{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.timeline div:last-child{border:0}
.timeline b{color:var(--tomyo);font-variant-numeric:tabular-nums}
.addr{font-size:14.5px;color:var(--chalk-2)}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;padding:13px 16px;border-radius:14px;font-weight:900;font-size:16px;text-decoration:none}
.btn.gold{background:var(--tomyo);color:var(--sumi)}
.btn.fb{background:#1877f2;color:#fff}
.comm-top{display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:center}
.comm-top img{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid var(--tomyo)}
.comm-top .nick{font-size:24px;font-weight:900;line-height:1.3}
.comm-top .full{font-size:15px;color:var(--chalk-2)}
.comm .org{font-size:14.5px;font-weight:700;color:var(--tomyo)}
.comm .links{display:grid;gap:8px}
.comm .links a.art{font-size:14px;line-height:1.55;color:var(--chalk);text-decoration:underline;text-decoration-color:var(--tomyo);text-underline-offset:3px}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(20,19,18,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
nav.tabs button{display:grid;justify-items:center;padding:6px 0 5px;border-radius:14px;font-size:13px;font-weight:700;color:var(--chalk-2);line-height:1.3}
nav.tabs button .i{width:24px;height:24px;margin-bottom:2px}
nav.tabs button[aria-current="page"]{color:var(--sumi);background:var(--tomyo)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="hero" id="hero">
    <svg class="hero-art" viewBox="0 0 340 118" aria-hidden="true">
      <g fill="#f7f4ec"><circle cx="40" cy="18" r="1.8"/><circle cx="120" cy="10" r="1.4"/><circle cx="208" cy="22" r="1.6"/><circle cx="90" cy="48" r="1.3"/></g>
      <circle cx="294" cy="38" r="28" fill="#fff3cf"/><circle cx="284" cy="31" r="4.5" fill="#f2deaa"/><circle cx="303" cy="48" r="3" fill="#f2deaa"/>
      <g fill="none" stroke="#f7f4ec" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M128 76 q40 -18 72 -36 q32 18 72 36"/>
        <path d="M172 52 q28 -12 56 0"/>
        <path d="M144 74 v40 M256 74 v40 M136 114 h128"/>
        <path d="M160 88 h80 M160 88 v26 M240 88 v26 M186 88 v26 M214 88 v26"/>
      </g>
      <path d="M32 72 l6 -12 l6 12 l12 -4 l-6 10 l10 6 l-14 2 l2 12 l-10 -8 l-10 8 l2 -12 l-14 -2 l10 -6 l-6 -10z" fill="#f08a62" stroke="#2b2622" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M82 96 l4 -8 l4 8 l8 -3 l-4 7 l7 4 l-9 1 l1 8 l-7 -5 l-7 5 l1 -8 l-9 -1 l7 -4 l-4 -7z" fill="#f2c46a" stroke="#2b2622" stroke-width="1.4" stroke-linejoin="round"/>
    </svg>
    <div class="hero-text">
      <p class="kicker">お寺で、ゆるく熱く語り合う。</p>
      <h1><span class="s">組織づくりの</span><span class="big">「秋の夜長」</span></h1>
    </div>
    <div class="friends" id="friends"></div>
    <p class="place"><b>妙壽寺 猿江別院</b><span>対話のしおり</span></p>
  </header>
  <main>
    <section data-view="first"></section>
    <section data-view="second" hidden></section>
    <section data-view="people" hidden></section>
    <section data-view="about" hidden></section>
  </main>
</div>

<nav class="tabs" aria-label="ページ切り替え">
  <button data-go="first"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 3.5a8.5 8.5 0 1 0 5 13.8A7 7 0 0 1 15.5 3.5z" fill="currentColor" stroke="none"/></svg>前半</button>
  <button data-go="second"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.2" fill="currentColor" stroke="none"/></svg>後半</button>
  <button data-go="people"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="9" r="3"/><circle cx="16" cy="9.5" r="2.5"/><path d="M3 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5M14.5 14.4c2.8-.5 5.4.9 6.3 4.6"/></svg>参加者</button>
  <button data-go="about"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 10.5Q12 9 21.5 10.5M4 7h16M7 7v13M17 7v13M5 13.5h14"/></svg>お寺と人</button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="プロフィール" hidden><div class="grab"></div><div class="inner" id="sheetInner"></div></div>

<script>
/* ---------- 参加者（参加者テーマ分析シートより） ---------- */
const P = {
  "daisuke": {role:"その他", moya:"新卒社員への過剰な配慮に違和感", main:"人材の受入・育成", sub:"心理的安全性", bring:"配慮と挑戦機会をどう両立するか", h:"A", i:"E", a:"elephant"},
  "Akihiro": {role:"その他", moya:"会社のビジョンが曖昧", main:"方向性・価値基準", sub:"意味づけ", bring:"ビジョンを日々の判断にどう接続するか", h:"C", i:"F", a:"lion"},
  "泉": {role:"その他", moya:"コンプライアンスに組織開発を応用したい", main:"変革実行・仕組み", sub:"ガバナンス", bring:"守る仕組みを学びと変化にどう変えるか", h:"D", i:"G", a:"fox"},
  "jun": {role:"人事・組織開発", moya:"次につながるフィードバックが回らない", main:"風土・対話・学習", sub:"仕組みとマインド", bring:"事実を学びに変える循環をどう作るか", h:"B", i:"E", a:"deer"},
  "zono": {role:"その他", moya:"既存事業から新たな一歩へ脱却できない", main:"変革実行・仕組み", sub:"イノベーション", bring:"既存を守りながら何を小さく試せるか", h:"D", i:"E", a:"monkey"},
  "畠山": {role:"その他", moya:"組織開発と人材育成", main:"人材の受入・育成", sub:"能力開発", bring:"育成を現場変化へどうつなげるか", h:"A", i:"H", a:"ox"},
  "武田": {role:"人事・組織開発", moya:"無理なく持続する組織風土づくり", main:"風土・対話・学習", sub:"持続性", bring:"続けられる最小の文化施策は何か", h:"B", i:"H", a:"turtle"},
  "iMasato": {role:"管理職", moya:"売上至上主義", main:"方向性・価値基準", sub:"成果指標", bring:"売上以外の価値をどう経営言語にするか", h:"C", i:"E", a:"tiger"},
  "ao": {role:"管理職", moya:"進めたいことへの協力者集め", main:"変革実行・仕組み", sub:"巻き込み", bring:"誰をどの順番で巻き込むと動くか", h:"D", i:"F", a:"mouse"},
  "halasia": {role:"人事・組織開発", moya:"本社部門がつくる価値・貨幣価値", main:"方向性・価値基準", sub:"コーポレート価値", bring:"間接部門の価値をどう測り語るか", h:"C", i:"G", a:"snake"},
  "まり〜な": {role:"人事・組織開発", moya:"熱量差で高熱量の人が居づらい", main:"風土・対話・学習", sub:"包摂性", bring:"異なる熱量が共存できる受け皿とは何か", h:"B", i:"F", a:"peacock"},
  "Nao": {role:"人事・組織開発", moya:"採用したい人物像が曖昧", main:"人材の受入・育成", sub:"採用基準", bring:"戦略と文化から採用像をどう定めるか", h:"A", i:"G", a:"rabbit"},
  "waka": {role:"人事・組織開発", moya:"緊急案件で組織づくりの時間と仲間がない", main:"変革実行・仕組み", sub:"優先順位・巻き込み", bring:"緊急業務の中に組織づくりをどう埋め込むか", h:"D", i:"H", a:"boar"},
  "Aoi": {role:"その他", moya:"新しく入った人のオンボーディング体制", main:"人材の受入・育成", sub:"オンボーディング", bring:"新しい人が早く関係と役割を得るには何が要るか", h:"A", i:"F", a:"dragon"}
};
const ANIMAL_INFO = {
  elephant:{n:"象", d:"普賢菩薩を乗せて歩む、六本の牙の象。"},
  lion:{n:"獅子", d:"文殊菩薩の乗りもの。智慧の声で場を照らす。"},
  fox:{n:"狐", d:"猿江別院にも祀られる、お稲荷さんのお使い。"},
  deer:{n:"鹿", d:"お釈迦さまが初めて教えを説いた、鹿野苑の鹿。"},
  monkey:{n:"猿", d:"ここ「猿江」の名を背負う、知恵の働き者。"},
  ox:{n:"牛", d:"大威徳明王を乗せる、粘り強い水牛。"},
  turtle:{n:"亀", d:"ゆっくり確かに歩む、長寿と持続のしるし。"},
  tiger:{n:"虎", d:"毘沙門天ゆかりの、勇気と守りの使い。"},
  mouse:{n:"鼠", d:"大黒天のお使い。仲間を呼び集める名人。"},
  snake:{n:"白蛇", d:"弁才天のお使い。価値と豊かさを運ぶ。"},
  peacock:{n:"孔雀", d:"孔雀明王の鳥。熱い想いを色彩に変える。"},
  rabbit:{n:"兎", d:"月に昇ったジャータカの兎。人をよく見つめる目。"},
  boar:{n:"猪", d:"摩利支天のお使い。忙しさの中を駆け抜ける。"},
  dragon:{n:"龍", d:"仏法を守る龍神。新しい人を迎える守り手。"}

}

/* ---------- プロフィール ---------- */
const sheet=$("#sheet"),scrim=$("#scrim");
const teamName=(list,id)=>{const t=list.find(x=>x.id===id);return `${t.id}　${t.name}`;};
function openPerson(n){
  const p=P[n],a=ANIMAL_INFO[p.a];
  $("#sheetInner").innerHTML=`
    <div class="prof-head">${animal(p.a)}<div><h3>${esc(n)}</h3><div class="anm">${a.n}のお使い</div><div class="role">立場：${esc(p.role)}</div></div></div>
    <div><div class="lbl">モヤモヤ</div><div class="moya">${esc(p.moya)}</div></div>
    <dl class="kv">
      <dt>主テーマ</dt><dd><span class="pill main">${esc(p.main)}</span></dd>
      <dt>副テーマ</dt><dd><span class="pill">${esc(p.sub)}</span></dd>
      <dt>持ち込む問い</dt><dd>${esc(p.bring)}</dd>
      <dt>前半チーム</dt><dd>${esc(teamName(FIRST,p.h))}</dd>
      <dt>後半チーム</dt><dd>${esc(teamName(SECOND,p.i))}</dd>
    </dl>
    <p class="anote">${esc(a.n)}：${esc(a.d)}</p>
    <button class="close" id="closeSheet">とじる</button>`;
  scrim.hidden=false;sheet.hidden=false;
  requestAnimationFrame(()=>{scrim.classList.add("show");sheet.classList.add("show");});
  sheet.scrollTop=0;
}
function closeSheet(){scrim.classList.remove("show");sheet.classList.remove("show");setTimeout(()=>{scrim.hidden=true;sheet.hidden=true;},260);}
scrim.addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!sheet.hidden)closeSheet();});

/* ---------- 画面切り替え ---------- */
const views=["first","second","people","about"];
function show(v,scroll=true){
  if(!views.includes(v))v="first";
  document.querySelectorAll("section[data-view]").forEach(s=>s.hidden=s.dataset.view!==v);
  document.querySelectorAll("nav.tabs button").forEach(b=>b.removeAttribute("aria-current"));
  document.querySelector(`nav.tabs button[data-go="${v}"]`).setAttribute("aria-current","page");
  try{history.replaceState(null,"","#"+v);}catch(e){}
  if(scroll){const top=$("main").getBoundingClientRect().top+window.scrollY-8;window.scrollTo(0,v==="first"?0:top);}
}
document.addEventListener("click",e=>{
  const go=e.target.closest("[data-go]");if(go){show(go.dataset.go);return;}
  if(e.target.closest("#closeSheet")){closeSheet();return;}
  const per=e.target.closest("[data-person]");if(per){openPerson(per.dataset.person);return;}
  const tb=e.target.closest(".team-btn");
  if(tb){const card=tb.parentElement,body=card.querySelector(".team-body"),open=!card.classList.contains("open");
    card.classList.toggle("open",open);body.hidden=!open;tb.setAttribute("aria-expanded",open);}
});
document.getElementById("friends").innerHTML=Object.keys(P).slice(0,7).map((n,i)=>animal(P[n].a).replace('class="av"',`class="av" style="--r:${[-6,4,-3,6,-5,3,-4,5,-2][i]}deg"`)).join("");
renderHalf(document.querySelector('[data-view="first"]'),"first",FIRST);
renderHalf(document.querySelector('[data-view="second"]'),"second",SECOND);
renderPeople(document.querySelector('[data-view="people"]'));
renderAbout(document.querySelector('[data-view="about"]'));
show((location.hash||"#first").slice(1),false);
</script>
